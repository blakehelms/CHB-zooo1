name: Generic updater safety
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Run generic safety tests
        run: python -m unittest discover -s tests -v

      - name: Build code-only package and validate inventory
        run: python tools/build_release.py v0.0.0 /tmp/zooo1-test.tar.gz

      - name: Check provisioning shell syntax
        run: sh -n app/LAUNCH.sh && sh -n app/INSTALL.sh
