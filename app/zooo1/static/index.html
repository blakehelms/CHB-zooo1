<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#500000"><title>zooo1 · Yamauchi Lab</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body>
<header><a class="wordmark" href="/" aria-label="zooo1 home">zooo1<span>YAMAUCHI LAB</span></a><nav id="nav" hidden><a id="monitor-link" href="/monitor" target="_blank" rel="noopener">Researcher monitor <span aria-hidden="true">↗</span></a><button id="logout" class="text-button">Sign out</button></nav></header>
<main id="app"><p class="eyebrow">TEXAS A&amp;M UNIVERSITY</p><h1>Welcome.</h1><p>Connecting to zooo1…</p></main>
<footer><span>Yamauchi Lab</span><span>Texas A&amp;M University</span></footer>
<template id="login-template"><section class="entry"><p class="eyebrow">RESEARCHER ACCESS</p><h1>A simple start.</h1><p class="lead">Sign in to prepare and manage a session.</p><form id="login-form"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="256"><p id="setup-note" class="hint" hidden>Set your researcher password (at least 8 characters). This setup stays on this computer.</p><p id="error" class="error" role="alert"></p><button class="primary" type="submit">Continue <span aria-hidden="true">→</span></button></form><p class="preview">Local prototype · no participant collection before approval.</p></section></template>
<template id="connect-template"><section class="entry headset-setup"><p class="eyebrow">HEADSET SETUP</p><h1>Connect Headset</h1><p class="lead">Turn on your assigned Muse headset and keep it nearby, ready to connect. zooo1 connects automatically.</p><div class="readiness" role="status" aria-live="polite"><strong id="headset-status">Waiting for connection status</strong><p id="headset-help" class="headset-help"></p></div><p class="hint">If it does not connect, check that the headset is charged, Bluetooth is enabled on the acquisition computer, and another app is not using the headset.</p></section></template>
<template id="connected-template"><section class="entry headset-setup"><p class="eyebrow">HEADSET SETUP</p><div class="headset-check" aria-hidden="true">✓</div><h1>Headset Connected</h1><p class="lead" role="status">your assigned Muse headset is connected and EEG is being received.</p><button id="headset-continue" class="primary">Continue <span aria-hidden="true">→</span></button><p class="hint headset-next">Next: participant information.</p></section></template>
<template id="form-template"><section class="entry"><p class="eyebrow">PARTICIPANT INFORMATION</p><h1>Let’s get ready.</h1><p class="lead">Please complete the details below.</p><p class="preview">Local preview · use fictional details only. Information fields are provisional pending IRB review.</p><form id="participant-form" autocomplete="off"><div class="fields"><div class="full"><label for="name">Full name</label><input id="name" name="name" type="text" required maxlength="150" autocomplete="off"></div><div><label for="dob">Date of birth</label><input id="dob" name="dob" type="date" required aria-describedby="date-hint"><span id="date-hint" class="hint">Month / day / year</span></div><div><label for="uin">UIN</label><input id="uin" name="uin" type="text" inputmode="numeric" maxlength="9" pattern="[0-9]{9}" autocomplete="off"></div><div><label for="gender">Gender</label><select id="gender" name="gender" required><option value="">Select an option</option><option>Male</option><option>Female</option><option>Other</option><option>Prefer not to say</option></select></div><div><label for="handedness">Handedness</label><select id="handedness" name="handedness" required><option value="">Select an option</option><option>Left</option><option>Right</option><option>Ambidextrous</option></select></div></div><div class="readiness" id="readiness" role="status"></div><p id="error" class="error" role="alert"></p><button id="start" class="primary" type="submit" disabled>Begin session <span aria-hidden="true">→</span></button></form></section></template>
<template id="session-template"><section class="entry session"><p class="eyebrow" id="session-label">SESSION IN PROGRESS</p><div class="symbol" aria-hidden="true">●</div><h1 id="session-title">You’re all set.</h1><p class="lead" id="session-description">Your researcher will guide you from here.</p><p id="session-time" class="time"></p><p id="save-status" class="readiness" role="status"></p><p id="error" class="error" role="alert"></p><button id="end" class="primary">End session</button><button id="new" class="primary" hidden>New session <span aria-hidden="true">→</span></button><p class="hint" id="session-code"></p></section></template>
<template id="monitor-template"><section class="monitor"><p class="eyebrow">RESEARCHER MONITOR</p><h1>Stay connected.</h1><p class="lead">Live status from the local acquisition service.</p><p id="network" class="readiness" role="status">Connected to the Pi service.</p><div class="metrics"><div><span>Session</span><strong id="m-state">—</strong></div><div><span>Elapsed</span><strong id="m-time">00:00</strong></div><div><span>Headset</span><strong id="m-headset">Unavailable</strong><small id="m-age">No samples received</small></div><div><span>Recording storage</span><strong id="m-storage">Not ready</strong><small id="m-count">0 confirmed samples</small></div></div><p id="m-detail" class="hint"></p><section class="trace-box"><div class="trace-heading"><h2>Live EEG</h2><span id="trace-caption">Waiting for real samples</span></div><canvas id="traces" height="300" aria-label="Real unfiltered EEG traces, each channel scaled independently"></canvas><p class="hint">Unfiltered stream · each channel scaled independently · no signal-quality assessment. Headset battery is unavailable in this adapter.</p></section><details><summary>Recent connection &amp; session events</summary><ul id="events"></ul></details><div class="actions"><button id="marker" class="secondary" disabled>Add marker</button><button id="end" class="primary" disabled>End session</button><button id="new" class="secondary" hidden>New session</button></div><p id="error" class="error" role="alert"></p><p class="preview">Bench prototype · production recording storage is not integrated.</p></section></template>
</body></html>
